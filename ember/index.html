<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>ember</title>
  <meta name="description" content="ember — a very small game about a small light and a moth." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <canvas id="game" width="480" height="420" aria-label="ember, a small turn-based game. Arrow keys move, Z confirms, X goes back, M toggles sound. On touch screens, tap to choose and drag to move."></canvas>
    <p id="live" class="sr-only" aria-live="polite"></p>
  </main>
  <noscript><p class="noscript">ember needs JavaScript to run.</p></noscript>
  <script src="ember.js" type="module"></script>
</body>
</html>
