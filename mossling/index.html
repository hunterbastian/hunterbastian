    <canvas id="game" aria-label="A small dithered forest glen with a mossy creature"></canvas>

    <aside id="hud">

      <p>a small glen. no hurry.</p>
      <dl>
        <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt>
        <dd>wander</dd>
        <dt><kbd>Shift</kbd></dt>

        <dt><kbd>[</kbd> <kbd>]</kbd></dt>
        <dd>pixel size</dd>
        <dt><kbd>H</kbd></dt>
