<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Underfern</title>
  <defs>
    <radialGradient id="bg" cx="0.32" cy="0.2" r="1">
      <stop offset="0" stop-color="#2b2920"/>
      <stop offset="1" stop-color="#100f0b"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="-22" x2="0" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5eedd"/>
      <stop offset="1" stop-color="#d4c6a3"/>
    </linearGradient>
    <!-- One digit: a pad tapering to a claw point, with two creases; base at the origin. -->
    <g id="toe">
      <path fill="url(#bone)" d="M-3.7 1C-4-5.5-3.3-12.3-1.7-17.5-1.2-19.2-.6-20.7 0-22.2c.6 1.5 1.2 3 1.7 4.7C3.3-12.3 4-5.5 3.7 1z"/>
      <path fill="none" stroke="#100f0b" stroke-opacity="0.3" stroke-width="0.9" stroke-linecap="round" d="M-3 -6.8q3 1.3 6 0M-2.3 -12.6q2.3 1 4.6 0"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#e8dfca" stroke-opacity="0.14"/>
  <!-- A three-toed theropod track (Eubrontes), the island's oldest signature. -->
  <g transform="translate(32 39.6) scale(1.1)">
    <use href="#toe" transform="translate(-2.6 0.4) rotate(-37)"/>
    <use href="#toe" transform="translate(2.6 0.4) rotate(37)"/>
    <use href="#toe" transform="translate(0 -1.6) scale(1.04 1.2)"/>
    <path fill="url(#bone)" d="M-5.6 1.2C-6.3 6.3-3.6 11.2 0 11.2s6.3-4.9 5.6-10C5-2.2 2.7-3.4 0-3.4S-5-2.2-5.6 1.2z"/>
  </g>
</svg>
