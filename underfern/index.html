<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Underfern</title>
  <meta name="description" content="Underfern — survive a misty island out of time as a dinosaur, from fragile hatchling to apex adult. A naturalistic 3D survival game that runs in your browser." />
  <meta name="theme-color" content="#12110d" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Home-screen web app (iOS & Android) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Underfern" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Type: Fraunces (display), Archivo (UI), IBM Plex Mono (data). Offline the
       system fallbacks in style.css take over and nothing breaks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <!-- #app is the game's frame: everything the game draws lives inside it. On a
       phone held upright src/core/screen.js lays it out at landscape size and
       turns it 90° (iOS can't lock orientation), so CSS inside sizes against
       this box (container units, @container app) rather than the viewport. -->
  <div id="app">
    <canvas id="game" aria-label="Underfern — the island"></canvas>
    <div id="ui"></div>

    <aside class="turn-note" id="turn-note" role="status">
      <svg class="turn-note__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g transform="rotate(-90 12 12)"><rect x="7.5" y="2.8" width="9" height="15.4" rx="1.8" /><path d="M11 15.4h2" /><path d="M3.5 13.5a8.6 8.6 0 0 0 7 7.7" /><path d="M8.6 20l1.9 1.2-1.1 1.9" /></g>
      </svg>
      <span class="turn-note__text"><b>Turn your phone sideways</b> <span>— Underfern plays in landscape</span></span>
    </aside>
  </div>

  <noscript>
    <div class="noscript">
      <div>
        <h1>Underfern</h1>
        <p>The island needs JavaScript to grow its forests and wake its dinosaurs. Please enable it and reload.</p>
      </div>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
